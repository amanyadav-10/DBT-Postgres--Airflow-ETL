name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: cricket
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Write dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          cricket_analytics:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                user: airflow
                password: airflow
                port: 5432
                dbname: cricket
                schema: public
                threads: 4
          EOF

      - name: Seed sample data (no external network needed)
        working-directory: dbt_project
        run: dbt seed

      - name: Run dbt models
        working-directory: dbt_project
        run: dbt run

      - name: Run dbt tests
        working-directory: dbt_project
        run: dbt test
